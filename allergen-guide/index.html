<style>
/* Layout: a chat thread between a brand band and a composer; results are cards inside bot bubbles. */
:root{
  --bg:#F6F3F3;
  --surface:#FFFFFF;
  --fg:#2A2326;
  --muted:#6B6266;
  --line:#E2DCDD;
  --brand:#942343;
  --brand-ink:#FFFFFF;
  --grey:#B5B5B6;
  --has-bg:#2A2326;
  --has-fg:#FFFFFF;
  --good:#1D6F47;
  --good-bg:#E2F1E8;
  --focus:#1A5FD0;
  --font-body:"Instrument Sans","Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171214;--surface:#231C1F;--fg:#F2EDEE;--muted:#AAA0A4;--line:#3A3034;
    --brand:#C24A6D;--brand-ink:#FFFFFF;--grey:#6F6669;
    --has-bg:#F2EDEE;--has-fg:#171214;--good:#7FD3A5;--good-bg:#17301F;--focus:#7FAEFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171214;--surface:#231C1F;--fg:#F2EDEE;--muted:#AAA0A4;--line:#3A3034;
  --brand:#C24A6D;--brand-ink:#FFFFFF;--grey:#6F6669;
  --has-bg:#F2EDEE;--has-fg:#171214;--good:#7FD3A5;--good-bg:#17301F;--focus:#7FAEFF;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;display:flex;flex-direction:column;margin:0}
html[lang="zh-Hans"] body{font-family:"Instrument Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
html[lang="zh-Hant"] body{font-family:"Instrument Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
html[lang="ko"] body{font-family:"Instrument Sans","Noto Sans KR","Malgun Gothic",sans-serif}
html[lang="th"] body{font-family:"Instrument Sans","Noto Sans Thai","Leelawadee UI",sans-serif}
html[lang="my"] body{font-family:"Instrument Sans","Noto Sans Myanmar","Myanmar Text",sans-serif}
[lang="ja"]{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.wrap{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Brand band */
.band{background:var(--brand);color:var(--brand-ink);border-bottom:4px solid var(--grey);flex:none}
.band .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.mark{font-weight:700;font-size:20px;letter-spacing:.08em;line-height:1;padding:8px 10px;border:2px solid currentColor;border-radius:4px}
.titles{min-width:0;flex:1 1 180px}
.titles h1{margin:0;font-size:17px;line-height:1.25;font-weight:600;text-wrap:balance}
.titles p{margin:0;font-size:12.5px;opacity:.88}
.langbtn{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.storebar{background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.storebar .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.storebar label{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.storebar select{min-width:0;flex:1 1 200px;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}

/* Thread */
#thread{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#thread .wrap{display:flex;flex-direction:column;gap:12px;padding-block:16px}
.msg{max-width:min(100%,640px);min-width:0;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--brand);color:var(--brand-ink);padding:9px 14px;border-radius:16px 16px 4px 16px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);padding:12px 14px;border-radius:16px 16px 16px 4px;width:100%}
.msg.bot > p{margin:0 0 8px}
.msg.bot > p:last-child{margin-bottom:0}
.hint{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:38px;font-size:14px}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"],.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* Result card */
.card{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.card:first-of-type{border-top:0;padding-top:0;margin-top:0}
.card h3{margin:0;font-size:17px;line-height:1.3;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted)}
.meta b{font-weight:600;color:var(--fg)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 0 0}
.als{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.al{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:6px;font-size:14px;font-weight:600;line-height:1.3}
.al small{font-weight:400;font-size:11.5px;opacity:.8}
.al i{font-style:normal;font-size:11px}
.al-has{background:var(--has-bg);color:var(--has-fg)}
.al-may{background:transparent;border:1.5px dashed var(--fg);color:var(--fg)}
.none{background:var(--good-bg);color:var(--good);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.inc{font-size:13px;color:var(--muted)}
details.combos{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
details.combos summary{cursor:pointer;font-weight:600;font-size:13.5px;min-height:28px}
.combo{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.combo:first-of-type{margin-top:8px}
.combo p{margin:0;font-size:13px}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.more{align-self:flex-start;margin-top:10px}

/* Selected allergens bar, result tabs, per-dish verdict */
.selbar{background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.selbar .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.sellbl{font-size:12.5px;color:var(--muted);font-weight:600;flex:none}
#selchips{flex:1 1 auto;min-width:0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
#selchips .al{white-space:nowrap;flex:none}
#seledit{flex:none;min-height:34px;padding:5px 12px;font-size:13px}
.tabs{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.tab{flex:1 1 auto;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:42px;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.cnt{display:inline-block;min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.hit{margin:0;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px}
.hit-has{background:var(--has-bg);color:var(--has-fg)}
.hit-may{border:1.5px dashed var(--fg)}
.hit-free{background:var(--good-bg);color:var(--good)}
.sub{margin:0 0 4px}

/* Allergen picker */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin:10px 0}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0;min-height:48px;overflow-wrap:anywhere}
.pick button small{font-size:11.5px;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--has-bg);color:var(--has-fg);border-color:var(--has-bg)}
.pick button[aria-pressed="true"] small{color:inherit;opacity:.8}
.go{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.warn{color:var(--brand);font-weight:600;font-size:13.5px;margin:8px 0 0;min-height:1.2em}
html[data-theme="dark"] .warn{color:#F29AB4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .warn{color:#F29AB4}}

/* Composer */
.composer{background:var(--surface);border-top:1px solid var(--line);flex:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.composer .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.quick .chip{flex:none;white-space:nowrap}
.quick .chip.alt{border-color:var(--brand);color:var(--brand);font-weight:600}
html[data-theme="dark"] .quick .chip.alt{color:#F29AB4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .quick .chip.alt{color:#F29AB4}}
form{display:flex;gap:8px}
form input{flex:1 1 auto;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-height:46px}
form button{flex:none;background:var(--brand);color:var(--brand-ink);border:0;border-radius:12px;padding:0 18px;font-weight:600;cursor:pointer;min-height:46px}
.note{margin:0;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){#thread{scroll-behavior:smooth}}

#gate{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#gate.on{display:block}
#gate .gin{padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
#gate .gmark{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
#gate .gmark .mark{flex:none}
#gate .card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:12px;padding:18px 16px;margin:12px 0}
#gate h2{font-size:1.15rem;line-height:1.4;margin:0 0 12px;color:var(--brand)}
#gate ol{margin:0;padding-left:1.4em}
#gate li{margin:0 0 12px;line-height:1.65}
#gate li:last-child{margin-bottom:0}
#gate .gneed{font-size:.85rem;color:var(--muted);margin:14px 0 8px}
#gate .gok{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));box-shadow:0 0 0 10px var(--bg);display:block;width:100%;min-height:52px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
#gate .gok:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.orlbl{margin:6px 0 4px;font-size:.8rem;color:var(--muted)}
.card h3 .jp{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:1px}
.pgrp{margin:14px 0 0;font-size:12.5px;font-weight:600;color:var(--muted)}
.pgrp + .pick{margin-top:6px}
.card .head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.card .head h3{min-width:0;flex:1}
.card img.ph{width:84px;height:84px;flex:none;object-fit:cover;border-radius:10px;background:var(--line)}
</style>

ko:{title:"알레르기 가이드",sub:"메뉴 알레르기 검색",greet:"안녕하세요! 메뉴 이름을 입력하시면 들어 있는 알레르기 유발 식품을 알려드립니다. 피해야 할 식품으로 메뉴를 찾을 수도 있습니다.",ph:"메뉴 이름 (예: 돼지고기 오코노미야키)",send:"보내기",rev:"알레르기가 있어요",revHead:"피해야 할 알레르기 식품을 선택해 주세요.",revGo:"메뉴 보기",revNone:"알레르기 식품을 하나 이상 선택해 주세요.",contains:"함유",may:"함유 가능성 있음 (교차 접촉)",none:"28개 품목 중 등록된 알레르기 식품이 없습니다. 직원에게 확인해 주세요.",inc:"구성",combos:"조합별로 보기",union:"모든 조합에 포함된 알레르기 식품을 표시합니다.",notFound:"해당 메뉴를 찾지 못했습니다. 다른 표기로 검색하거나 직원에게 문의해 주세요. 이 목록에 없는 메뉴가 알레르기 식품을 포함하지 않는다는 뜻은 아닙니다.",dym:"혹시 이 메뉴인가요?",storeLbl:"이용 중인 매장",storeAll:"전체 매장",more:"더 보기",note:"이 안내는 참고용입니다. 알레르기가 있으면 반드시 직원에게 알려 주세요.",foot:"주방에서 교차 접촉이 발생할 수 있습니다. 알레르기가 심한 경우 주문 전에 직원에게 알려 주세요.",freeHead:"선택한 알레르기 식품이 등록되지 않은 메뉴",freeNote:"등록 정보가 없는 메뉴와 해당 식품이 포함될 가능성이 있는 메뉴는 표시되지 않습니다. 직원에게 확인해 주세요.",freeEmpty:"해당하는 메뉴가 없습니다. 직원에게 문의해 주세요.",tryLbl:"예시:",langBtn:"언어",pickLang:"언어를 선택해 주세요",allStoresTag:"전체 매장"},
fr:{title:"Guide des allergènes",sub:"Recherche d'allergènes par plat",greet:"Bonjour ! Saisissez le nom d'un plat et je vous indique les allergènes qu'il contient. Vous pouvez aussi chercher selon l'allergène à éviter.",ph:"Nom du plat, ex. okonomiyaki au porc",send:"Envoyer",rev:"Je suis allergique à…",revHead:"Sélectionnez les allergènes à éviter.",revGo:"Afficher les plats",revNone:"Sélectionnez au moins un allergène.",contains:"Contient",may:"Peut contenir (contact croisé)",none:"Aucun allergène enregistré parmi les 28 listés. Veuillez vérifier auprès du personnel.",inc:"Composition",combos:"Voir chaque combinaison",union:"Les allergènes de toutes les combinaisons sont indiqués.",notFound:"Plat introuvable. Essayez une autre orthographe ou demandez au personnel. Un plat absent de cette liste n'est pas forcément sans allergène.",dym:"Vouliez-vous dire :",storeLbl:"Votre restaurant",storeAll:"Tous les restaurants",more:"Afficher plus",note:"Ce guide est donné à titre indicatif. Signalez toujours votre allergie au personnel.",foot:"Un contact croisé peut se produire en cuisine. En cas d'allergie sévère, prévenez le personnel avant de commander.",freeHead:"Plats ne mentionnant aucun de vos allergènes",freeNote:"Les plats sans données enregistrées et ceux pouvant contenir vos allergènes ne sont pas affichés. Veuillez vérifier auprès du personnel.",freeEmpty:"Aucun plat correspondant. Veuillez demander au personnel.",tryLbl:"Essayez :",langBtn:"Langue",pickLang:"Choisissez votre langue",allStoresTag:"Tous les restaurants"},
de:{title:"Allergen-Guide",sub:"Allergensuche nach Gericht",greet:"Hallo! Geben Sie den Namen eines Gerichts ein, dann zeige ich die enthaltenen Allergene. Sie können auch nach dem Allergen suchen, das Sie meiden müssen.",ph:"Gericht, z. B. Okonomiyaki mit Schwein",send:"Senden",rev:"Ich bin allergisch gegen…",revHead:"Wählen Sie die Allergene, die Sie meiden müssen.",revGo:"Gerichte anzeigen",revNone:"Bitte mindestens ein Allergen wählen.",contains:"Enthält",may:"Kann enthalten (Kreuzkontakt)",none:"Unter den 28 Allergenen ist keines erfasst. Bitte beim Personal nachfragen.",inc:"Bestandteile",combos:"Jede Kombination anzeigen",union:"Angezeigt werden die Allergene aller Kombinationen.",notFound:"Gericht nicht gefunden. Versuchen Sie eine andere Schreibweise oder fragen Sie das Personal. Ein Gericht, das hier fehlt, ist nicht automatisch allergenfrei.",dym:"Meinten Sie:",storeLbl:"Ihr Restaurant",storeAll:"Alle Restaurants",more:"Mehr anzeigen",note:"Dieser Guide dient nur zur Orientierung. Bitte informieren Sie das Personal immer über Ihre Allergie.",foot:"In der Küche kann es zu Kreuzkontakt kommen. Bei schwerer Allergie informieren Sie bitte vor der Bestellung das Personal.",freeHead:"Gerichte ohne Ihre Allergene in der Liste",freeNote:"Gerichte ohne erfasste Daten und Gerichte, die Ihre Allergene enthalten könnten, werden nicht angezeigt. Bitte beim Personal nachfragen.",freeEmpty:"Keine passenden Gerichte gefunden. Bitte das Personal fragen.",tryLbl:"Beispiele:",langBtn:"Sprache",pickLang:"Sprache wählen",allStoresTag:"Alle Restaurants"},
it:{title:"Guida agli allergeni",sub:"Ricerca allergeni per piatto",greet:"Buongiorno! Scrivi il nome di un piatto e ti mostro gli allergeni che contiene. Puoi anche cercare in base all'allergene da evitare.",ph:"Nome del piatto, es. okonomiyaki di maiale",send:"Invia",rev:"Sono allergico a…",revHead:"Seleziona gli allergeni da evitare.",revGo:"Mostra i piatti",revNone:"Seleziona almeno un allergene.",contains:"Contiene",may:"Può contenere (contaminazione crociata)",none:"Nessun allergene registrato tra i 28 elencati. Chiedi conferma al personale.",inc:"Include",combos:"Mostra ogni combinazione",union:"Sono mostrati gli allergeni di tutte le combinazioni.",notFound:"Piatto non trovato. Prova un'altra grafia o chiedi al personale. Un piatto assente da questo elenco non è necessariamente privo di allergeni.",dym:"Intendevi:",storeLbl:"Il tuo ristorante",storeAll:"Tutti i ristoranti",more:"Mostra altri",note:"Questa guida è indicativa. Segnala sempre la tua allergia al personale.",foot:"In cucina può verificarsi contaminazione crociata. In caso di allergia grave, avvisa il personale prima di ordinare.",freeHead:"Piatti che non elencano i tuoi allergeni",freeNote:"Non sono mostrati i piatti senza dati registrati né quelli che potrebbero contenere i tuoi allergeni. Chiedi conferma al personale.",freeEmpty:"Nessun piatto corrispondente. Chiedi al personale.",tryLbl:"Prova:",langBtn:"Lingua",pickLang:"Scegli la lingua",allStoresTag:"Tutti i ristoranti"},
th:{title:"คู่มือสารก่อภูมิแพ้",sub:"ค้นหาสารก่อภูมิแพ้ในเมนู",greet:"สวัสดีค่ะ/ครับ! พิมพ์ชื่อเมนู แล้วระบบจะแสดงสารก่อภูมิแพ้ที่มีอยู่ นอกจากนี้ยังค้นหาจากสิ่งที่ต้องหลีกเลี่ยงได้",ph:"ชื่อเมนู เช่น โอโคโนมิยากิหมู",send:"ส่ง",rev:"ฉันแพ้…",revHead:"เลือกสิ่งที่คุณต้องหลีกเลี่ยง",revGo:"แสดงเมนู",revNone:"กรุณาเลือกอย่างน้อย 1 รายการ",contains:"มีส่วนผสม",may:"อาจมี (ปนเปื้อนข้าม)",none:"ไม่มีรายการสารก่อภูมิแพ้ใน 28 รายการที่ลงทะเบียนไว้ กรุณายืนยันกับพนักงาน",inc:"ประกอบด้วย",combos:"ดูแต่ละชุดที่เลือกได้",union:"แสดงสารก่อภูมิแพ้ของทุกชุดรวมกัน",notFound:"ไม่พบเมนูนี้ ลองสะกดอีกแบบหรือสอบถามพนักงาน เมนูที่ไม่อยู่ในรายการนี้ไม่ได้แปลว่าปลอดสารก่อภูมิแพ้",dym:"คุณหมายถึง:",storeLbl:"สาขาของคุณ",storeAll:"ทุกสาขา",more:"ดูเพิ่มเติม",note:"คู่มือนี้ใช้เพื่อประกอบการพิจารณาเท่านั้น โปรดแจ้งพนักงานเรื่องอาการแพ้ของคุณเสมอ",foot:"อาจเกิดการปนเปื้อนข้ามในครัว หากแพ้รุนแรง โปรดแจ้งพนักงานก่อนสั่งอาหาร",freeHead:"เมนูที่ไม่มีสิ่งที่คุณแพ้ในรายการ",freeNote:"ไม่แสดงเมนูที่ไม่มีข้อมูลลงทะเบียน และเมนูที่อาจมีสิ่งที่คุณแพ้ กรุณายืนยันกับพนักงาน",freeEmpty:"ไม่พบเมนูที่ตรงเงื่อนไข กรุณาสอบถามพนักงาน",tryLbl:"ลอง:",langBtn:"ภาษา",pickLang:"เลือกภาษา",allStoresTag:"ทุกสาขา"},

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}
function norm(s){
  s=String(s||'').normalize('NFKC').toLowerCase();
  s=s.replace(/焼き/g,'焼');
  s=s.replace(/[ァ-ヶ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x60);});
  s=s.replace(/[\s・、，,.\-ー～~()（）「」『』'’"!?！？\/／＆&]/g,'');
  return s;
}
var ALIAS=[];
ALIAS_SRC.forEach(function(a){
  var targets=a[0].map(norm);
  a[1].forEach(function(w){
    var raw=w.normalize('NFKC').toLowerCase();
    ALIAS.push({raw:raw,ascii:/^[\x00-\x7f]+$/.test(raw),space:/\s/.test(raw),targets:targets});
  });
});

  groups.forEach(function(g){

    g.nt=g.t?norm(Object.keys(g.t).map(function(l){return g.t[l];}).join(' ')):'';
    g.nc=norm(Object.keys(g.cats).join(' '));
    g.np=norm(g.vars.map(function(v){return v.p;}).join(' '));
  });
}

/* ---------- search ---------- */
function parseQuery(q){
  var rest=String(q).normalize('NFKC').toLowerCase().trim(),reqs=[],i,al;
  for(i=0;i<ALIAS.length;i++){al=ALIAS[i];
    if(!al.ascii||al.space){if(rest.indexOf(al.raw)>-1){reqs.push({t:al.targets,soft:false});rest=rest.split(al.raw).join(' ');}}
  }
  var toks=rest.split(/[\s,、，.;\/]+/).filter(Boolean);
  toks.forEach(function(t){
    var hit=null;
    for(var j=0;j<ALIAS.length;j++){al=ALIAS[j];
      if(al.ascii&&!al.space){
        if(t===al.raw||t===al.raw+'s'||(al.raw.length>=5&&t.length>=4&&al.raw.indexOf(t)===0)){hit=al;break;}
      }
    }
    if(hit){reqs.push({t:hit.targets,soft:false});}else{var n=norm(t);if(n)reqs.push({t:[n],soft:/^[\x00-\x7f]+$/.test(t)});}
  });
  return reqs;
}
function inStore(g){return store==='all'||g.s==='GM'||g.s===store;}
function bigrams(s){var o={};for(var i=0;i<s.length-1;i++)o[s.substr(i,2)]=1;return o;}
function dice(a,b){
  var A=bigrams(a),B=bigrams(b),n=0,na=0,nb=0,k;
  for(k in A){na++;if(B[k])n++;}for(k in B)nb++;
  return na+nb?2*n/(na+nb):0;
}
function search(q){
  var all=parseQuery(q);
  if(!all.length)return {list:[],near:[]};
  var hard=all.filter(function(r){return !r.soft;});
  var qn=norm(q),pool=groups.filter(inStore);
  function run(reqs,withParts){
    return pool.filter(function(g){
      var hay=g.nn+' '+g.nt+' '+g.nc+(withParts?' '+g.np:'');
      return reqs.every(function(r){return r.t.some(function(t){return hay.indexOf(t)>-1;});});
    });
  }
  var list=run(all,false);
  if(!list.length)list=run(all,true);
  /* An unknown English word (e.g. "mixed") is dropped only when the rest of the query is understood. */
  if(!list.length&&hard.length&&hard.length<all.length){list=run(hard,false);if(!list.length)list=run(hard,true);}
  var first=(hard[0]||all[0]).t[0];
  list.sort(function(a,b){
    function rank(g){
      if(g.nn===qn)return 0;
      var inName=g.nn.indexOf(first)>-1;
      if(inName&&g.nc.indexOf(first)>-1)return 1;
      if(g.nn.indexOf(first)===0)return 2;
      return inName?3:4;
    }
    var d=rank(a)-rank(b);if(d)return d;
    var ga=a.s==='GM'?0:1,gb=b.s==='GM'?0:1;if(ga!==gb)return ga-gb;
    return a.n<b.n?-1:a.n>b.n?1:0;
  });
  var near=[];
  if(!list.length&&qn.length>=2){
    near=pool.map(function(g){return {g:g,s:dice(qn,g.nn)};}).filter(function(x){return x.s>=0.34;})
      .sort(function(a,b){return b.s-a.s;}).slice(0,4).map(function(x){return x.g;});
  }
  return {list:list,near:near};
}

function classify(){
  var out={free:[],may:[],has:[],nodata:0},seen={};
  groups.filter(inStore).forEach(function(g){
    g.vars.forEach(function(v){
      var key=g.s+'|'+g.n+'|'+v.p+'|'+v.a;if(seen[key])return;seen[key]=1;
      var o=overlap(v.a),row={g:g,v:v,o:o};
      if(o.h.length)out.has.push(row);
      else if(o.m.length)out.may.push(row);
      else if(/^0+$/.test(v.a)){if(v.ok)out.free.push(row);else out.nodata++;}
      else out.free.push(row);
    });
  });
  ['free','may','has'].forEach(function(k){
    out[k].sort(function(a,b){var ga=a.g.s==='GM'?0:1,gb=b.g.s==='GM'?0:1;return ga-gb||(a.g.n<b.g.n?-1:a.g.n>b.g.n?1:0);});
  });
  return out;
}

    :'<p class="hit hit-free">'+esc(T('cardFree'))+'</p>';
  return '<article class="card">'+nameHTML(r.g)+'<div class="meta"><span>'+esc(cats)+'</span><span lang="ja"><b>'+esc(storeTag(r.g))+'</b></span></div>'+ban+(r.v.p?'<p class="inc"><b>'+esc(T('inc'))+':</b> <span lang="ja">'+esc(r.v.p)+'</span></p>':'')+allergenBlock(r.v.a,r.v.ok)+'</article>';

var GAPP=['band','storebar','selbar','thread'];
function gateEls(){var a=[];['.band','.storebar','.selbar','#thread','.composer'].forEach(function(q){var e=document.querySelector(q);if(e)a.push(e);});return a;}
function renderGate(){
  var g=GATE[lang]||GATE.en,L=LANGS.filter(function(x){return x.c===lang;})[0];
  var box=$('gate');box.setAttribute('lang',L.h);
  $('gt').textContent=g.t;
  $('gl').innerHTML=['a','b','c','d'].map(function(k){return '<li>'+esc(g[k])+'</li>';}).join('');
  $('gneed').textContent=g.need;$('gok').textContent=g.ok;
  var h='<div class="chips" role="group" aria-label="Language">'+LANGS.map(function(l){
    return '<button type="button" class="chip'+(l.c===lang?' on':'')+'" data-l="'+l.c+'" lang="'+l.h+'" aria-pressed="'+(l.c===lang)+'">'+esc(l.n)+'</button>';}).join('')+'</div>';
  $('glangs').innerHTML=h;
  $('glangs').querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){setLang(b.getAttribute('data-l'),true);renderGate();});});
}
function openGate(){
  gateEls().forEach(function(e){e.setAttribute('inert','');e.setAttribute('aria-hidden','true');});
  renderGate();$('gate').classList.add('on');$('gate').scrollTop=0;
  try{$('gate').focus({preventScroll:true});}catch(e){}
}
function closeGate(){
  gateEls().forEach(function(e){e.removeAttribute('inert');e.removeAttribute('aria-hidden');});
  $('gate').classList.remove('on');thread.scrollTop=0;
}
$('gok').addEventListener('click',closeGate);

/* ---------- live data (GAS) ---------- */
var REQ_AL=['海老','蟹','小麦','そば','玉子','乳','落花生','くるみ','カシューナッツ'];
function validPayload(P){
  try{
    if(!P||P.ok===false||P.v!==1)return 'schema';
    if(!Array.isArray(P.allergens)||P.allergens.length<20)return 'allergens';
    var names=P.allergens.map(function(a){return a&&a.n;});
    for(var i=0;i<REQ_AL.length;i++){if(names.indexOf(REQ_AL[i])<0)return 'required allergen '+REQ_AL[i];}
    if(!Array.isArray(P.items)||P.items.length<50)return 'items';
    if(!Array.isArray(P.stores)||!P.stores.length)return 'stores';
    var re=/^[012]+$/,gm=0;
    for(var j=0;j<P.items.length;j++){
      var it=P.items[j];
      if(!it||typeof it.n!=='string'||typeof it.a!=='string'||it.a.length!==names.length||!re.test(it.a))return 'item '+j;
      if(it.s==='GM')gm++;
    }
    if(gm<50)return 'grand menu';
    return '';
  }catch(e){return 'error';}
}
function adopt(P){
  var keep=sel.map(function(i){return AL[i];});
  ingest(P);sel=namesToSel(keep);IS_LIVE=true;
  if(store!=='all'&&STORES.indexOf(store)<0)store='all';
  applyUI();
  if(msgs.querySelectorAll('.msg').length<=1)greet();
}
function loadLive(){
  if(!API_URL||!window.fetch)return;
  var ctl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},20000);
  fetch(API_URL+(API_URL.indexOf('?')<0?'?':'&')+'_='+Date.now(),{signal:ctl?ctl.signal:undefined})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(P){clearTimeout(to);var e=validPayload(P);if(e){window.LIVE_ERR='rejected '+e+(P&&P.error?' / '+P.error:'');try{applyUI();}catch(x){}if(window.console)console.warn('allergen data rejected: '+e+(P&&P.error?' / '+P.error:''));return;}adopt(P);})
    .catch(function(e){clearTimeout(to);window.LIVE_ERR='fetch '+(e&&e.message?e.message:e);try{applyUI();}catch(x){}if(window.console)console.warn('allergen data fetch failed',e);});
}

(function init(){
  var saved=safeGet('chibo-allergy-lang');
  lang=LANGS.some(function(l){return l.c===saved;})?saved:detectLang();
  var s=safeGet('chibo-allergy-store');
  var qs='';try{qs=new URLSearchParams(location.search).get('store')||'';}catch(e){}
  if(qs&&STORES.indexOf(qs)>-1)store=qs;else if(s&&STORES.indexOf(s)>-1)store=s;
  try{sel=namesToSel(JSON.parse(safeGet('chibo-allergy-sel2')||'[]'));}catch(e){sel=[];}
  $('seledit').addEventListener('click',function(){openPicker(true);});
  applyUI();greet();openGate();loadLive();
})();
})();
